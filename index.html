<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Сообщения</title>
  <meta name="description" content="Готовые сообщения на разные темы: скопируйте или отправьте в мессенджер.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" aria-label="Назад" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 class="topbar-title" id="title">Сообщения</h1>
    <button class="lang-btn" id="langBtn" aria-label="Язык">UK</button>
    <a class="icon-btn" id="favBtn" href="#/favorites" aria-label="Избранное">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 3 5 6.6 5c2.1 0 3.6 1.2 4.4 2.5h2C13.8 6.2 15.3 5 17.4 5 21 5 23 8.6 21.6 11.8 19.5 16.4 12 21 12 21z"/></svg>
      <span class="badge" id="favCount" hidden>0</span>
    </a>
  </header>

  <main id="app" class="container" aria-live="polite"></main>

  <div class="toast" id="toast" role="status" hidden></div>

  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <h2 id="sheetTitle">Отправить</h2>
      <div class="sheet-actions" id="sheetActions"></div>
      <button class="btn btn-ghost sheet-close" id="sheetClose">Отмена</button>
    </div>
  </div>

  <noscript>Для работы приложения включите JavaScript.</noscript>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
